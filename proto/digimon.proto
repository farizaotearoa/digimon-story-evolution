syntax = "proto3";

package digimon;

option go_package = "digimon-story-evolution/proto/digimon";

// Digimon Service - handles all Digimon-related operations
service DigimonService {
  // Get list of Digimon with filtering and pagination
  rpc GetDigimonList(GetDigimonListRequest) returns (GetDigimonListResponse);
  
  // Get total count of Digimon for pagination
  rpc GetDigimonListSize(GetDigimonListRequest) returns (GetDigimonListSizeResponse);
  
  // Get detailed information about a specific Digimon
  rpc GetDigimonDetails(GetDigimonDetailsRequest) returns (GetDigimonDetailsResponse);
  
  // Get evolution information for a Digimon
  rpc GetDigimonEvolutions(GetDigimonDetailsRequest) returns (GetDigimonEvolutionsResponse);
}

// Request for getting Digimon list
message GetDigimonListRequest {
  int32 page_num = 1;
  int32 page_size = 2;
  string sort_by = 3;
  string sort_order = 4;
  repeated string stage = 5;
  repeated string type = 6;
  repeated string attribute = 7;
}

// Response for Digimon list
message GetDigimonListResponse {
  repeated DigimonListItem digimon = 1;
}

// Individual Digimon item in list
message DigimonListItem {
  string number = 1;
  string name = 2;
  string stage = 3;
  string type = 4;
  string attribute = 5;
  string image = 6;
  string icon = 7;
}

// Response for Digimon list size
message GetDigimonListSizeResponse {
  int32 size = 1;
}

// Request for getting Digimon details
message GetDigimonDetailsRequest {
  string number = 1;
}

// Response for Digimon details
message GetDigimonDetailsResponse {
  string number = 1;
  string name = 2;
  string stage = 3;
  string type = 4;
  string attribute = 5;
  string image = 6;
  string icon = 7;
  string description = 8;
  repeated string skills = 9;
  repeated string attacks = 10;
  repeated string special_abilities = 11;
  DigimonStats stats = 12;
}

// Digimon statistics
message DigimonStats {
  int32 hp = 1;
  int32 mp = 2;
  int32 attack = 3;
  int32 defense = 4;
  int32 speed = 5;
  int32 intelligence = 6;
}

// Response for Digimon evolutions
message GetDigimonEvolutionsResponse {
  repeated DigimonEvolution evolutions = 1;
}

// Individual evolution information
message DigimonEvolution {
  string number = 1;
  string name = 2;
  string stage = 3;
  string type = 4;
  string attribute = 5;
  string image = 6;
  string icon = 7;
  repeated DigivolveRequirement requirements = 8;
}

// Digivolve requirements
message DigivolveRequirement {
  string type = 1;
  string value = 2;
  string description = 3;
}
