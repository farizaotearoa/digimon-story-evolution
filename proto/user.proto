syntax = "proto3";

package user;

option go_package = "digimon-story-evolution/proto";

// User Service - handles user management and contributions
service UserService {
  // Create a new user contribution
  rpc CreateContribution(CreateContributionRequest) returns (CreateContributionResponse);
  
  // Get user's contributions
  rpc GetUserContributions(GetUserContributionsRequest) returns (GetUserContributionsResponse);
  
  // Get a specific contribution
  rpc GetContribution(GetContributionRequest) returns (GetContributionResponse);
  
  // Update a contribution
  rpc UpdateContribution(UpdateContributionRequest) returns (UpdateContributionResponse);
  
  // Delete a contribution
  rpc DeleteContribution(DeleteContributionRequest) returns (DeleteContributionResponse);
}

// Request for creating a contribution
message CreateContributionRequest {
  string user_id = 1;
  string digimon_id = 2;
  string type = 3; // "new", "update", "correction"
  string description = 4;
  map<string, string> metadata = 5;
}

// Response for creating a contribution
message CreateContributionResponse {
  Contribution contribution = 1;
}

// Request for getting user contributions
message GetUserContributionsRequest {
  string user_id = 1;
  int32 page_num = 2;
  int32 page_size = 3;
  string status = 4; // "pending", "approved", "rejected"
}

// Response for user contributions
message GetUserContributionsResponse {
  repeated Contribution contributions = 1;
  int32 total_count = 2;
}

// Request for getting a specific contribution
message GetContributionRequest {
  string contribution_id = 1;
}

// Response for getting a contribution
message GetContributionResponse {
  Contribution contribution = 1;
}

// Request for updating a contribution
message UpdateContributionRequest {
  string contribution_id = 1;
  string description = 2;
  map<string, string> metadata = 3;
}

// Response for updating a contribution
message UpdateContributionResponse {
  Contribution contribution = 1;
}

// Request for deleting a contribution
message DeleteContributionRequest {
  string contribution_id = 1;
  string user_id = 2;
}

// Response for deleting a contribution
message DeleteContributionResponse {
  bool success = 1;
}

// Contribution message
message Contribution {
  string id = 1;
  string user_id = 2;
  string digimon_id = 3;
  string type = 4;
  string description = 5;
  string status = 6; // "pending", "approved", "rejected"
  string created_at = 7;
  string updated_at = 8;
  map<string, string> metadata = 9;
  UserContributionInfo user_info = 10;
}

// User information for contributions
message UserContributionInfo {
  string id = 1;
  string username = 2;
  string email = 3;
  string avatar = 4;
}
